[paths]
extra_skill_dirs = [
    "/home/userk21/open_grok_cli/skills",
    "/home/userk21/open_grok_cli/skills",
]
extra_rule_dirs = [
    "/home/userk21/open_grok_cli/rules",
]

[skills]
paths = [
    "/home/userk21/open_grok_cli/skills",
    "/home/userk21/open_grok_cli/skills",
]

[subagents]
enabled = true
limit_behavior = "queue"
max_concurrent = 4
max_depth = 3

[subagents.models]
general-purpose = "local-llama"
explore = "local-llama"
plan = "local-llama"
researcher = "local-llama"
reviewer = "local-llama"
implementer = "local-llama"
test-writer = "local-llama"
security-auditor = "local-llama"
design-doc-writer = "local-llama"
design-doc-reviewer = "local-llama"

[mcp_servers.web_access]
command = "python3"
args = ["/home/userk21/open_grok_cli/bin/mcp_web.py"]
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 60

[telemetry]
otel_enabled = false
mixpanel_enabled = false
trace_upload = false

[features]
telemetry = "off"
feedback = false
managed_config = false
remote_fetch = false
web_fetch = true
campaigns = false
ask_user_question = true
write_file = true
backend_tools = true

[marketplace]
default_skills_installs_purged = true
official_marketplace_auto_installed = false
sources = []

[ui]
max_thoughts_width = 120
fork_secondary_model = "local-llama"
yolo = false
compact_mode = false
permission_mode = "always-approve"
