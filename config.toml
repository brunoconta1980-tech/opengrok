[cli]
installer = "internal"
auto_update = false

[endpoints]
models_base_url = "http://127.0.0.1:5174/v1"
models_list_url = "http://127.0.0.1:5174/v1/models"
cli_chat_proxy_base_url = "http://127.0.0.1:5174/v1"
xai_api_base_url = "http://127.0.0.1:5174/v1"
feedback_base_url = "http://127.0.0.1:5174/v1/feedback"

[models]
default = "local-llama"
stream_tool_calls = true
temperature = 0.7
top_p = 0.95
max_completion_tokens = 8192
web_search = "local-llama"

# Modelo principal roteado pelo Bridge Universal com CORS PLENO
[model.local-llama]
model = "local-llama"
name = "Local LLaMA (Bridge 5174 -> llama-server)"
base_url = "http://127.0.0.1:5174/v1"
api_key = "local"
api_backend = "chat_completions"
context_window = 131072
temperature = 0.7
top_p = 0.95
stream_tool_calls = true
supports_backend_search = true

